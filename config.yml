# Bracken — operating thresholds. Tune here, not in CLAUDE.md.
# Last reviewed: 2026-09-14

economics:
  price: 49.99
  product_cogs: 9.50           # CONFIRMED landed cost (owner, 2026-09-14).
  shipping_cost: 0.00          # Treated as included in the $9.50 landed figure.
  payment_fee_pct: 2.9          # estimate; the one real order was charged $2.23 on $49.99
  payment_fee_flat: 0.30
  actual_fee_observed: 2.23     # order #1007: $49.99 captured, $47.76 to payout
  est_refund_rate: 0.00        # 1 of 6 lifetime orders refunded (#1001) — too little data to set.
  # contribution margin = 49.99 - 9.50 - 2.23 = 38.26  (measured on order #1007)

targets:
  break_even_roas: 1.31        # price / contribution margin = 49.99 / 38.26
  target_roas: 2.2
  break_even_cpa: 38.26        # = contribution margin per order
  # At target_roas 2.2 the allowable CPA is 49.99 / 2.2 = 22.72

spend:
  daily_ad_spend_cap: 100.00
  max_daily_budget_increase: 20   # percent, per adset
  new_campaign_test_budget: 20.00
  min_data_before_action: 20.00

kill_rules:
  min_impressions: 1000
  min_spend: 20.00
  min_days: 2
  kill_ad_cpa_multiple: 1.5     # kill if CPA > 1.5x break-even CPA AND ROAS < 1.0
  kill_adset_roas_3d: 0.8
  fatigue_frequency_7d: 2.5
  fatigue_ctr_drop_pct: 30

